<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card Component</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Main Container using semantic article tag -->
    <article class="product-card">
        <!-- Image Placeholder -->
        <div class="product-image">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=800&auto=format&fit=crop" alt="Product Image">
        </div>

        <!-- Content Area -->
        <div class="product-info">
            <h2 class="product-title">Classic Minimalist Watch</h2>
            <p class="product-description">
                A sleek, modern timepiece designed for daily elegance. Crafted with premium materials for durability and timeless style.
            </p>
            <a href="#" class="cta-button">Buy Now</a>
        </div>
    </article>

</body>
</html>
